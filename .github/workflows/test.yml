name: test
# Push to main only (no pull_request, no schedule): runs this repo's own offline tests and demos. No secrets, read-only token.
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo:offline
      - run: npm run demo:rewrite
